name: Sentinel analytics rules

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "rules/**"
      - ".github/workflows/sentinel.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "rules/**"
      - ".github/workflows/sentinel.yml"
  workflow_dispatch:

permissions:
  id-token: write # OIDC sign-in to Azure
  contents: read
  pull-requests: write # post the plan on the PR

# One Terraform run at a time; never cancel an apply halfway.
concurrency:
  group: sentinel-terraform
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

defaults:
  run:
    working-directory: terraform

jobs:
  plan:
    name: Plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: >-
          terraform init
          -backend-config="resource_group_name=${{ vars.TF_STATE_RG }}"
          -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE }}"

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -out=tfplan > plan.txt 2>&1
          status=$?
          set -e
          cat plan.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Post plan on the pull request
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v7
        env:
          PLAN_STATUS: ${{ steps.plan.outputs.status }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- sentinel-terraform-plan -->';
            let plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            const summary = (plan.match(/Plan: .*|No changes\..*/) || ['See the log below.'])[0];
            if (plan.length > 60000) plan = '...(truncated)\n' + plan.slice(-60000);
            const ok = process.env.PLAN_STATUS === '0';
            const body = [
              marker,
              `### Terraform plan ${ok ? 'succeeded' : 'failed'}`,
              `**${summary}**`,
              '<details><summary>Show plan</summary>',
              '',
              '```',
              plan,
              '```',
              '</details>',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if plan failed
        if: steps.plan.outputs.status != '0'
        run: exit 1

  apply:
    name: Apply
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform init
        run: >-
          terraform init
          -backend-config="resource_group_name=${{ vars.TF_STATE_RG }}"
          -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE }}"

      - name: terraform plan
        run: terraform plan -no-color -out=tfplan

      - name: terraform apply
        run: terraform apply -no-color -auto-approve tfplan
